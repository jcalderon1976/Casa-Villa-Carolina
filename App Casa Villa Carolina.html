<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa Villa Carolina</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2321;--mute:#6b736f;--line:#e4e2dc;--acc:#1f6f5c;--acc2:#c98a2b;--neg:#b4412f;--pos:#1f7a4d;--chip:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#e9ecea;--mute:#9aa39f;--line:#2e3432;--acc:#4fb595;--acc2:#e0a54c;--neg:#e0705d;--pos:#5cc78d;--chip:#24302c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header small{color:var(--mute)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--chip);color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.k2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .s{color:var(--mute);font-size:12.5px}
.hero{border-left:5px solid var(--acc)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.warn td{background:color-mix(in srgb,var(--acc2) 12%,transparent)}
.tw{overflow:auto;max-height:65vh;padding:0 8px 8px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;margin-bottom:14px;transition:.15s}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--chip)}
.drop b{color:var(--acc)}.drop .st{font-size:12.5px;margin-top:6px;color:var(--mute)}
.drop.has{display:flex;gap:12px;align-items:center;text-align:left;padding:10px}
.drop img.th{width:64px;height:64px;object-fit:cover;border-radius:6px}
.auto{box-shadow:0 0 0 2px var(--acc2) inset}
.splits{display:flex;gap:4px;flex-wrap:wrap}
.span2{grid-column:span 2}@media(max-width:640px){.span2{grid-column:auto}}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--chip);font-size:11.5px;color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:760px;width:94vw}
dialog::backdrop{background:#0006}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gal img{width:100%;height:170px;object-fit:cover;display:block;cursor:zoom-in}.gal figcaption{padding:8px 10px;font-size:12.5px}
.doc{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.doc a{color:var(--acc);text-decoration:none;font-weight:500}
.alert{border-left:4px solid var(--acc2);padding:8px 12px;background:var(--card);border-radius:6px;margin:6px 0;font-size:13px}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.slider{display:flex;gap:10px;align-items:center}.slider input[type=range]{flex:1}
@media(max-width:640px){.hbar{grid-template-columns:100px 1fr 80px}header{position:static}}
</style>
</head>
<body>
<header>
  <div><h1>🏠 Casa Villa Carolina</h1><small>Solar #3 Manzana 202, Urb. Villa Carolina · Flip — Jose Javier Calderon & Arnaldo Aponte</small></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><nav id="nav"></nav>
   <button class="btn" id="syncBtn" onclick="syncExcel(true)" title="Sincronizar con el Excel">🔄 Sincronizar Excel</button><small id="syncSt" class="mute"></small></div>

<main id="app"></main>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>

<script>
const KEY='villaCarolina.v1';
const CATS=['Adquisición','Cierre / Legal','Techo / Exterior','Electricidad','Cocina','Baño','Piso','Puertas / Ventanas','Herramientas / Equipo','Misceláneos','Tenencia (CRIM / luz / agua / seguro)'];
const PEOPLE={J:'Jose Javier',A:'Arnaldo'};
let uid=1;const E=(cat,desc,vendor,receipt,total,date,jose,arnaldo,note,file,check)=>({id:uid++,cat,desc,vendor,receipt:receipt||'',total,date:date||'',jose:jose||0,arnaldo:arnaldo||0,note:note||'',file:file||'',check:check||''});

// Datos iniciales tomados de "Estimados de costos.xlsx" + documentos de cierre
const SEED={
 settings:{salePrice:260000,commissionPct:5,sellerClosing:3000,renoBudget:25000,profitSplit:'capital',targetRoi:20},
 expenses:[
  E('Adquisición','Precio de compra – cheque a vendedor (Enrique Rodríguez)','Banco Popular','103114600016304',71182,'2026-07-20',71182,0,'Cheque oficial','Cheques Pago Total07272026.pdf'),
  E('Adquisición','Precio de compra – cheque a vendedora (Lissa Dávila)','Banco Popular','103114600016302',71182,'2026-07-20',0,71182,'Cheque oficial','Cheques Pago Total07272026.pdf'),
  E('Adquisición','Factura legal parte vendedora (descontada del precio)','Lcda. Lesbia Hernández','103114600016303',2636,'2026-07-20',0,2636,'Parte del precio de $150,000','Cheques Pago Total07272026.pdf'),
  E('Adquisición','Depósito de buena fe','—','',5000,'2026-06-07',2500,2500,'Parte del precio de $150,000','Contrato Compra y Venta Casa Villa Carolina06072026 (1).pdf','¿Quién pagó el depósito? Se asumió 50/50 — corregir'),
  E('Cierre / Legal','Factura legal parte compradora (escritura, aranceles, CRIM)','Lcda. Lesbia Hernández','',1199.5,'2026-07-20',599.75,599.75,'','Factura y desglose de pago por gastos legales07272026.pdf','¿Quién pagó? Se asumió 50/50 — corregir'),
  E('Cierre / Legal','Cargos de cheques oficiales (3 × $10)','Banco Popular','',30,'2026-07-20',10,20,'','Cheques Pago Total07272026.pdf'),
  E('Techo / Exterior','Sellado de techo / estucado / pintura / jardín','Jose','',4500,'',1750,2250,'Restan $500'),
  E('Electricidad','Electricista','Rigo Electric','',1100,'2026-08-19',550,550,''),
  E('Electricidad','Electricista (cotización, se restó del trabajo)','Rigo Electric','',98,'2026-08-27',49,49,'Se pagó por cotización'),
  E('Cocina','Ebanistería – cotización','jbmProjectsPr','',150,'2026-08-20',75,75,'Cotización muy alta'),
  E('Techo / Exterior','Materiales techo (Crossco 8500, Harris, pega)','Home Depot','C7LUN-PDG6U',492.79,'2026-09-21',246.39,246.40,'','Home Depot $492.79  Sep 21 2026 eReceipt.pdf'),
  E('Herramientas / Equipo','Hammer Milwaukee (shipping)','Home Depot','DP3TP-THSC3',348.95,'2026-08-29',174.47,174.48,'Herramientas','Home Depot $348.95    Aug 29 2026 eReceipt.pdf'),
  E('Herramientas / Equipo','Wet Tile Saw','Home Depot','FX5FD-P71PL',279.55,'2026-08-05',139.77,139.78,'','Home Depot 279.55    Aug 5  2026 - Tile Cutter-  eReceipt.pdf'),
  E('Puertas / Ventanas','1 puerta – back patio','Luis Mercado','',400,'2026-09-23',200,200,'','', 'Excel: depósito $200 pero Jose $200 + Arnaldo $200 = $400. Verificar'),
  E('Techo / Exterior','Renta máquina de presión (techo)','JD Equipment & Supply','4KFHH9E8MQAEP',116.5,'2026-09-09',58.25,58.25,''),
  E('Cocina','Cocina – gabinetes/instalación','Dario','1753',4240,'2026-10-09',1500,740,'Restan $2,000','planso de cocina lower.png'),
  E('Baño','Ducha baño pasillo y switch de luces','Home Depot','',492.79,'',492.79,0,'','Home Depot $193.10    Aug 1 2026 - Shower -  eReceipt.pdf','Mismo monto que la compra de techo del 21-sep ($492.79). ¿Duplicado? El recibo de ducha es $193.10'),
  E('Piso','Instalación de losas','Jose','',4000,'',2000,0,'Restan $2,000'),
  E('Piso','Losas 24"×24"','Carolina Tile Outlet','',2892.31,'',2892.31,0,'1.69 ft² losa 24×24','losas 24 x 24 1.30 home depot.png'),
  E('Piso','Envío de losas (ATH Móvil)','Juan Acevedo – Carolina Tile Outlet','',250,'',250,0,''),
  E('Piso','Bloques, pegas de losa, herramientas','Home Depot','U9UW5-TWY73',210.87,'2026-09-30',0,210.87,'','Home Depot $210 Spet 30 2026 eReceipt.pdf'),
  E('Herramientas / Equipo','Renta máquina destapar desagües + disco 5" canaletas','JD Equipment & Supply','XZFRQAK19HR1R',189.51,'2026-09-23',189.51,0,'','', 'Excel muestra $169.97 pagado vs. total $189.51. Verificar'),
  E('Misceláneos','Angulares','Market China','345242',17.06,'2026-09-29',17.06,0,''),
  E('Misceláneos','Ferretería – angulares','Pepito Food Market','C3202583',51.41,'2026-09-28',51.41,0,''),
  E('Electricidad','Tornillos y bases para receptáculos','National Lumber','',8.99,'2026-09-30',8.99,0,''),
  E('Piso','Lash floor level clip','Home Depot','8X4GH-HF2TV',232.58,'2026-09-30',232.58,0,''),
  E('Misceláneos','Door locks, goznes, pintura de bañera','Amazon','',257.33,'2026-10-07',257.33,0,'','', 'Pago no registrado en Excel; se asumió pagado por Jose'),
  E('Baño','Ducha, sellador de techo, misceláneos','Home Depot','',411.64,'2026-10-07',0,411.64,'','Home Depot 411.64  Octubre 7 2026 -Shower-Sellado de Techo .pdf','Pago no registrado en Excel; se asumió pagado por Arnaldo'),
  E('Puertas / Ventanas','11 ventanas – cocina, sala, frente','Javier – Ventanas','',3495,'',0,0,'Pendiente'),
  E('Puertas / Ventanas','2 fijos – frente','Air Master','',458,'',0,0,'Pendiente'),
  E('Puertas / Ventanas','2 puertas – cocina','Luis Mercado','',0,'',0,0,'Falta cotización','', 'Sin precio todavía'),
 ]};

const DOCS=[
 ['Compra / Legal','Contrato Compra y Venta Casa Villa Carolina06072026 (1).pdf','Contrato de compraventa (7 jun 2026)'],
 ['Compra / Legal','Contrato-firmado.pdf','Contrato firmado'],
 ['Compra / Legal','cuadre.pdf','Desglose de cheques del cierre'],
 ['Compra / Legal','Cheques Pago Total07272026.pdf','Cheques oficiales de pago'],
 ['Compra / Legal','Cheque Conpraventa 2.pdf','Cheque compraventa 2'],
 ['Compra / Legal','Factura y desglose de pago por gastos legales07272026.pdf','Factura legal parte compradora'],
 ['Compra / Legal','certificado de pago por gastos legales07272026.pdf','Certificado de pago gastos legales'],
 ['Compra / Legal','Complete_with_Docusign_Mutual_NDA_Orchids_Te.pdf','NDA mutuo (DocuSign)'],
 ['Tasación','Tasacion VillaCarolina.pdf','Tasación'],
 ['Recibos','Home Depot $193.10    Aug 1 2026 - Shower -  eReceipt.pdf','Home Depot $193.10 – Ducha (1 ago)'],
 ['Recibos','Home Depot 279.55    Aug 5  2026 - Tile Cutter-  eReceipt.pdf','Home Depot $279.55 – Tile saw (5 ago)'],
 ['Recibos','Home Depot $348.95    Aug 29 2026 eReceipt.pdf','Home Depot $348.95 (29 ago)'],
 ['Recibos','Home Depot $120.42 - Canceled   Aug 29 2026 eReceipt.pdf','Home Depot $120.42 – CANCELADO (29 ago)'],
 ['Recibos','Home Depot $492.79  Sep 21 2026 eReceipt.pdf','Home Depot $492.79 (21 sep)'],
 ['Recibos','Home Depot $210 Spet 30 2026 eReceipt.pdf','Home Depot $210.87 (30 sep)'],
 ['Recibos','Home Depot 411.64  Octubre 7 2026 -Shower-Sellado de Techo .pdf','Home Depot $411.64 – Ducha / sellador (7 oct)'],
 ['Recibos','Recibo 411.64 Home Depot 10-7-2026.png','Recibo $411.64 (imagen)'],
 ['Planos','plano.jpg','Plano de la casa'],
 ['Planos','planso de cocina lower.png','Plano gabinetes cocina'],
];
const PHOTOS=[
 ['front view original.jpeg','Frente – original'],['Fron View - Remodelado.jpeg','Frente – remodelado'],
 ['cocina original.jpeg','Cocina – original'],['cocina remodelada.jpeg','Cocina – remodelada'],['cocina remodelada 2.jpeg','Cocina – remodelada 2'],['cocina remodelada 3.jpeg','Cocina – remodelada 3'],
 ['bano master.jpg','Baño master'],['casa piso losa 12 x 12.jpg','Piso losa 12×12'],['casa piso losa 24 x 24.png','Piso losa 24×24 (render)'],
 ['losas 24 x 24 1.30 home depot.png','Losa 24×24 Home Depot'],['Problema de luz.jpg','Problema de luz'],['plano.jpg','Plano'],
];

let S=load(),tab=(()=>{try{return localStorage.getItem(KEY+'.tab')}catch(e){}})()||'dash',sort={k:'date',d:1},filt={q:'',cat:'',st:''};
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.expenses){s.expenses.forEach(e=>{if(/^Tenencia/.test(e.cat))e.cat=CATS[10]});uid=Math.max(0,...s.expenses.map(e=>e.id))+1;return s}}catch(e){}return structuredClone(SEED)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.autoPush)autoPush()}
const $=n=>'$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const $0=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(+n||0)).toLocaleString('en-US');
const pct=n=>(isFinite(n)?n.toFixed(1):'0')+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const href=f=>encodeURI(f).replace(/#/g,'%23');
const paid=e=>(+e.jose||0)+(+e.arnaldo||0);
const pend=e=>Math.max(0,(+e.total||0)-paid(e));

function calc(){
 const ex=S.expenses,st=S.settings,sum=f=>ex.reduce((a,e)=>a+f(e),0);
 const acq=sum(e=>e.cat==='Adquisición'?+e.total:0),close=sum(e=>e.cat==='Cierre / Legal'?+e.total:0);
 const reno=sum(e=>['Adquisición','Cierre / Legal'].includes(e.cat)?0:+e.total);
 const total=acq+close+reno,paidT=sum(paid),pendT=sum(pend);
 const sell=st.salePrice*st.commissionPct/100+ +st.sellerClosing;
 const net=st.salePrice-sell,profit=net-total;
 const J=sum(e=>+e.jose),A=sum(e=>+e.arnaldo);
 const be=(total+ +st.sellerClosing)/(1-st.commissionPct/100);
 const byCat={};ex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+ +e.total);
 const flags=ex.filter(e=>e.check);
 const maxReno=(net/(1+st.targetRoi/100))-acq-close;
 return{acq,close,reno,total,paidT,pendT,sell,net,profit,roi:profit/total*100,margin:profit/st.salePrice*100,J,A,be,byCat,flags,maxReno};
}
function shares(c){const s=S.settings.profitSplit;let pj=.5;if(s==='capital'&&c.J+c.A>0)pj=c.J/(c.J+c.A);return{pj,pa:1-pj}}

const TABS={dash:'Dashboard',gastos:'Gastos',socios:'Socios',docs:'Documentos',fotos:'Fotos',ajustes:'Ajustes'};
function nav(){document.getElementById('nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(t){tab=t;try{localStorage.setItem(KEY+'.tab',t)}catch(e){}render()}
// Los avisos "Para revisar" se quitan solos cuando cambia el total o lo pagado (ej. se corrigió el monto)
const chk=e=>[e.total,e.jose,e.arnaldo].map(v=>(+v||0).toFixed(2)).join('|');
function resolveChecks(){let ch=false;for(const e of S.expenses){if(!e.check)continue;
 if(!e.checkAt){const s=SEED.expenses.find(z=>z.id===e.id&&z.check===e.check);e.checkAt=chk(s||e);ch=true}
 if(e.checkAt!==chk(e)){e.check='';delete e.checkAt;ch=true}}
 if(ch)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}}
function resolve(id){const e=S.expenses.find(x=>x.id===id);if(e){e.check='';delete e.checkAt;save();render()}}
function render(){resolveChecks();nav();document.getElementById('app').innerHTML=({dash:vDash,gastos:vGastos,socios:vSocios,docs:vDocs,fotos:vFotos,ajustes:vAjustes})[tab]();}

function vDash(){
 const c=calc(),st=S.settings,rb=Math.min(100,c.reno/st.renoBudget*100);
 const cats=Object.entries(c.byCat).filter(([k])=>k!=='Adquisición').sort((a,b)=>b[1]-a[1]),mx=Math.max(...cats.map(x=>x[1]),1);
 const sens=[230000,240000,250000,260000,270000,280000].map(p=>{const n=p*(1-st.commissionPct/100)-st.sellerClosing,pr=n-c.total;return`<tr${p==st.salePrice?' style="font-weight:700"':''}><td>${$0(p)}</td><td class="n ${pr<0?'neg':'pos'}">${$0(pr)}</td><td class="n">${pct(pr/c.total*100)}</td><td class="n">${pct(pr/p*100)}</td></tr>`}).join('');
 return`
 <div class="card hero" style="margin-bottom:14px">
  <div class="slider"><b>Precio de venta meta</b><input type="range" min="200000" max="320000" step="1000" value="${st.salePrice}" oninput="setS('salePrice',+this.value,1)"><b style="font-size:20px;min-width:110px;text-align:right">${$0(st.salePrice)}</b></div>
  <div class="slider mute" style="margin-top:6px">Comisión de venta<input type="range" min="0" max="7" step="0.5" value="${st.commissionPct}" oninput="setS('commissionPct',+this.value,1)"><span style="min-width:110px;text-align:right">${st.commissionPct}% + ${$0(st.sellerClosing)} cierre</span></div>
 </div>
 <div class="grid k4">
  <div class="card kpi"><h3>Ganancia neta proyectada</h3><div class="v ${c.profit<0?'neg':'pos'}">${$0(c.profit)}</div><div class="s">después de ${$0(c.sell)} en costos de venta</div></div>
  <div class="card kpi"><h3>% Ganancia (ROI)</h3><div class="v ${c.roi<0?'neg':'pos'}">${pct(c.roi)}</div><div class="s">ganancia ÷ inversión total · margen sobre venta ${pct(c.margin)}</div></div>
  <div class="card kpi"><h3>Inversión total</h3><div class="v">${$0(c.total)}</div><div class="s">compra ${$0(c.acq)} · cierre ${$0(c.close)} · remodelación ${$0(c.reno)}</div></div>
  <div class="card kpi"><h3>Punto de equilibrio</h3><div class="v">${$0(c.be)}</div><div class="s">precio mínimo de venta para no perder</div></div>
 </div>
 <div class="grid k2" style="margin-top:14px">
  <div class="card"><h3>Presupuesto de remodelación</h3>
   <div class="row"><span>Comprometido</span><b>${$0(c.reno)} de ${$0(st.renoBudget)}</b></div>
   <div class="bar" style="margin:8px 0"><i style="width:${rb}%;background:${rb>95?'var(--neg)':rb>80?'var(--acc2)':'var(--acc)'}"></i></div>
   <div class="row"><span>Disponible</span><b class="${st.renoBudget-c.reno<0?'neg':''}">${$0(st.renoBudget-c.reno)}</b></div>
   <div class="row"><span>Pagado hasta hoy (todo)</span><b>${$0(c.paidT)}</b></div>
   <div class="row"><span>Pendiente por pagar</span><b class="neg">${$0(c.pendT)}</b></div>
   <div class="row"><span>Máx. remodelación para ROI de ${st.targetRoi}%</span><b>${$0(c.maxReno)}</b></div>
  </div>
  <div class="card"><h3>Gastos por categoría (sin precio de compra)</h3>
   ${cats.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="bar"><i style="width:${v/mx*100}%"></i></div><b class="n" style="text-align:right">${$0(v)}</b></div>`).join('')}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let pendingUpload=null;const _js={};
const loadJS=src=>_js[src]||(_js[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete _js[src];rej(new Error('No se pudo cargar el lector (¿hay internet?)'))};document.head.appendChild(s)}));
function idb(op,key,val){return new Promise((res,rej)=>{const o=indexedDB.open('villaCarolina',1);o.onupgradeneeded=()=>o.result.createObjectStore('files');o.onerror=()=>rej(o.error);o.onsuccess=()=>{const st=o.result.transaction('files',op==='get'?'readonly':'readwrite').objectStore('files'),q=op==='put'?st.put(val,key):st[op](key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}})}
async function openUpload(id){try{const b=await idb('get',id);if(!b)throw 0;window.open(URL.createObjectURL(b),'_blank')}catch(e){alert('El archivo del recibo no está en este navegador. Importa un respaldo que lo incluya.')}}
function dropMsg(html){const d=document.getElementById('drop');if(d){d.classList.add('has');d.innerHTML=html}}

async function readReceipt(file){
 if(!file)return;pendingUpload=file;
 const thumb=file.type.startsWith('image/')?`<img class="th" src="${URL.createObjectURL(file)}">`:'<span style="font-size:40px">📄</span>';
 const show=st=>dropMsg(`${thumb}<div><b>${esc(file.name)}</b><div class="st">${st}</div></div>`);
 show('Leyendo el recibo…');
 try{
  let text;
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))text=await pdfText(file,show);
  else if(file.type.startsWith('image/'))text=await ocr(file,show);
  else throw new Error('Formato no soportado. Usa PDF, JPG o PNG.');
  const r=parseReceipt(text),n=fillForm(r);
  const dup=S.expenses.find(x=>(r.receipt&&x.receipt===r.receipt)||(r.total&&Math.abs(x.total-r.total)<.005&&(!r.date||!x.date||x.date===r.date)));
  show(`${n?`✓ Se llenaron <b>${n}</b> campos (resaltados). Revísalos antes de guardar.`:'No se pudo leer información útil; llena los campos a mano.'}`+
   (r.total&&!r.hasTotal?`<div style="color:var(--acc2);margin-top:4px">⚠ No encontré la línea TOTAL; verifica el monto.</div>`:'')+
   (dup?`<div style="color:var(--neg);margin-top:4px">⚠ Posible duplicado: «${esc(dup.desc)}» ${$(dup.total)} ${esc(dup.date)}</div>`:'')+
   `<div style="margin-top:4px"><a href="#" onclick="event.stopPropagation();document.getElementById('rf').click();return false">Cambiar archivo</a></div>`);
 }catch(err){show(`<span style="color:var(--neg)">${esc(err.message||err)}</span> — el archivo igual se guardará con el gasto.`)}
}
async function pdfText(file,show){
 await loadJS(PDFJS);pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let out='';
 for(let p=1;p<=Math.min(pdf.numPages,4);p++){
  const tc=await(await pdf.getPage(p)).getTextContent(),rows=[];
  for(const it of tc.items){if(!it.str.trim())continue;const x=it.transform[4],y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r)rows.push(r={y,i:[]});r.i.push({x,s:it.str})}
  rows.sort((a,b)=>b.y-a.y);out+=rows.map(r=>r.i.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')).join('\n')+'\n';
 }
 if(out.replace(/\s/g,'').length>30&&/\bTOTAL\b/i.test(out))return out;
 show('PDF escaneado: leyendo la imagen con OCR…');
 const pg=await pdf.getPage(1),vp=pg.getViewport({scale:2.5}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
 await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return ocr(c,show);
}
async function ocr(img,show){
 show('Cargando lector de texto (OCR)…');await loadJS(TESS);img=await prep(img);
 const{data}=await Tesseract.recognize(img,'eng',{logger:m=>m.status==='recognizing text'&&show(`Leyendo texto… ${Math.round(m.progress*100)}%`)});
 return fixOcr(data.text);
}
// Agranda recibos pequeños/angostos y los pasa a blanco y negro para que el OCR los lea mejor
async function prep(src){
 let bmp=src;if(src instanceof Blob)bmp=await createImageBitmap(src);
 const w=bmp.width,h=bmp.height,k=Math.min(Math.max(1,1700/w),Math.sqrt(30e6/(w*h)));
 const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
 const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,c.width,c.height);return c}
// Corrige letras que el OCR confunde con números dentro de montos (411.€4 → 411.64)
const fixOcr=t=>t.replace(/[$\d€£SOolI|]*\d[$\d€£SOolI|]*[.,][\d€£SOolI|]{2}\b/g,m=>m.replace(/[€£]/g,'6').replace(/[Oo]/g,'0').replace(/[lI|]/g,'1').replace(/S/g,'5'));
const VENDORS=[[/HOME ?DEPOT|HOW DOERS/,'Home Depot'],[/LOWE'?S/,"Lowe's"],[/AMAZON/,'Amazon'],[/NATIONAL LUMBER/,'National Lumber'],[/JD EQUI/,'JD Equipment & Supply'],[/CAROLINA TILE/,'Carolina Tile Outlet'],[/PEPITO/,'Pepito Food Market'],[/MARKET CHINA/,'Market China'],[/WAL-?MART/,'Walmart'],[/COSTCO/,'Costco'],[/SAM'?S CLUB/,"Sam's Club"],[/BUILDERS/,'Builders'],[/KRESKO/,'Kresko'],[/ACE HARDWARE/,'Ace Hardware'],[/PLAZA LAS AM/,'Plaza Las Américas']];
const CATKW={'Piso':/TILE|LOSA|THINSET|GROUT|PEGA|LEVEL(ING)? CLIP|FLOOR|PISO|MORTAR/g,'Baño':/SHOWER|DUCHA|TOILET|INODORO|FAUCET|LAVAMANOS|BAÑ|BATH|VANITY|TUB/g,
 'Techo / Exterior':/ROOF|TECHO|SEAL|SELLA|PAINT|PINTURA|STUCCO|ESTUC|GUTTER|CANALETA|PRESSURE|PRESION|COAT/g,'Electricidad':/WIRE|CABLE|BREAKER|OUTLET|RECEPT|SWITCH|BULB|LIGHT|ELECTRIC|GFCI|CONDUIT/g,
 'Cocina':/CABINET|GABINETE|COUNTER|SINK|FREGADERO|KITCHEN|COCINA|ESTUFA/g,'Puertas / Ventanas':/DOOR|PUERTA|WINDOW|VENTANA|HINGE|GOZNE|LOCK|CERRADURA/g,
 'Herramientas / Equipo':/DRILL|TALADRO|SAW|SIERRA|HAMMER|MARTILLO|\bBITS?\b|BLADE|DISCO|RENTAL|RENTA|ALQUILER|MILWAUKEE|\bMKE\b|DEWALT|RYOBI|TOOL/g};
const MES={jan:1,ene:1,feb:2,mar:3,apr:4,abr:4,may:5,jun:6,jul:7,aug:8,ago:8,sep:9,oct:10,nov:11,dec:12,dic:12};
function parseReceipt(t){
 const L=t.split(/\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean),U=t.toUpperCase(),r={},num=s=>+s.replace(/[^\d.]/g,'');
 const AMT=/\$?\s?(\d{1,3}(?:,\d{3})*\.\d{2}|\d+\.\d{2})/g,SKIP=/SUB-?TOTAL|SAVING|AHORR|\bTAX\b|IVU|ITEMS|ART[IÍ]CULOS|DESCUENTO|DISCOUNT|CAMBIO|CHANGE/i;
 // Total: el mayor monto en líneas que dicen TOTAL/AMOUNT/MONTO
 const tl=L.filter(l=>/\b(TOTAL|AMOUNT|MONTO|BALANCE|PAGADO)\b/i.test(l)&&!SKIP.test(l)).flatMap(l=>[...l.matchAll(AMT)].map(m=>num(m[1])));
 const all=[...t.matchAll(AMT)].map(m=>num(m[1]));
 r.total=tl.length?Math.max(...tl):all.length?Math.max(...all):null;r.hasTotal=tl.length>0;
 // Fecha
 const ok=(y,m,d)=>{y=+y<100?2000+ +y:+y;m=+m;d=+d;return y>=2020&&y<=2040&&m>=1&&m<=12&&d>=1&&d<=31?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null};
 const mes=s=>MES[s.toLowerCase()];
 for(const[re,fn]of[[/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g,m=>ok(m[1],m[2],m[3])],[/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/g,m=>ok(m[3],m[1],m[2])],
   [/\b([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\b/g,m=>mes(m[1])&&ok(m[3],mes(m[1]),m[2])],[/\b(\d{1,2})\s+de\s+([a-z]{3})[a-z]*\s+(?:de\s+)?(\d{4})\b/gi,m=>mes(m[2])&&ok(m[3],mes(m[2]),m[1])]]){
  for(const m of t.matchAll(re)){const d=fn(m);if(d){r.date=d;break}}
  if(r.date)break}
 // Suplidor
 const known=S.expenses.map(e=>e.vendor).filter(v=>v&&v.length>3&&v!=='—');

  await firstBackup(file);const rg=writePro(x);writeResumen(wb,x,rg);await writeOut(await wb.xlsx.writeBuffer());wrote=true}
 setBase(now);render();
 const p=[];if(R.fromX)p.push(`${R.fromX} cambio(s) traídos del Excel`);if(R.added)p.push(`${R.added} nuevo(s) del Excel`);if(R.deleted)p.push(`${R.deleted} borrado(s)`);if(wrote)p.push('Excel actualizado');
 return p.join(' · ')||'sin cambios'}
async function firstBackup(file){try{const k=KEY+'.bk2.'+file.name;if(localStorage.getItem(k))return;dl(file.name.replace(/\.xlsx$/i,'')+' - copia antes de sincronizar Proyeccion.xlsx',file,file.type);localStorage.setItem(k,'1')}catch(e){}}

async function syncExcel(manual){
 if(syncing)return;clearTimeout(retryT);
 if(!hasFS){if(manual)fallbackSync();return}
 try{
  if(!xHandle){if(!manual)return;await pickExcel()}
  const o={mode:'readwrite'};
  if(await xHandle.queryPermission(o)!=='granted'){if(!manual){syncStatus('Presiona 🔄 para sincronizar');return}if(await xHandle.requestPermission(o)!=='granted')throw new Error('No se dio permiso para usar el archivo')}
  syncing=true;syncStatus('Sincronizando…');
  const msg=await syncCore(await xHandle.getFile(),async buf=>{const w=await xHandle.createWritable();await w.write(buf);await w.close()});
  lastMod=(await xHandle.getFile()).lastModified;syncStatus(`✓ ${new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} — ${msg}`);
 }catch(e){
  if(e.name==='AbortError')syncStatus('');
  else if(/NoModificationAllowed|InvalidState|NotReadable|NotAllowed/.test(e.name)&&xHandle){syncStatus('⚠ El Excel está abierto: ciérralo (después de guardar) y se sincroniza solo',true);retryT=setTimeout(()=>syncExcel(false),10000)}
  else syncStatus('⚠ '+(e.message||e),true)}
 finally{syncing=false}}
function fallbackSync(){const i=document.createElement('input');i.type='file';i.accept='.xlsx';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;syncStatus('Sincronizando…');
  try{const msg=await syncCore(f,async buf=>dl(f.name,buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'));syncStatus(`✓ ${msg}. Si se descargó un Excel, reemplaza el de la carpeta con ese archivo.`)}catch(e){syncStatus('⚠ '+(e.message||e),true)}};i.click()}
// Cambios en la app → Excel (automático si ya hay permiso). Cambios en el Excel → app al volver a esta ventana.
window.autoPush=()=>{if(!xHandle)return;clearTimeout(pushT);pushT=setTimeout(()=>syncExcel(false),1500)};
async function checkExcel(){if(!xHandle||syncing)return;try{if(await xHandle.queryPermission({mode:'readwrite'})!=='granted')return;if((await xHandle.getFile()).lastModified!==lastMod)syncExcel(false)}catch(e){}}
window.addEventListener('focus',checkExcel);document.addEventListener('visibilitychange',()=>document.visibilityState==='visible'&&checkExcel());
(async()=>{try{xHandle=await idb('get','excelHandle')||null}catch(e){}
 if(xHandle)syncExcel(false);else syncStatus(hasFS?'Excel no conectado':'');})();

function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const toDataURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function backup(){const files={};
 for(const e of S.expenses.filter(e=>e.upload)){try{const b=await idb('get',e.id);if(b)files[e.id]=await toDataURL(b)}catch(x){}}
 dl('villa-carolina-respaldo-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...S,files}),'application/json')}
function restore(f){if(!f)return;f.text().then(async t=>{const s=JSON.parse(t);if(!s.expenses)throw 0;const files=s.files||{};delete s.files;
 for(const[id,u]of Object.entries(files)){try{await idb('put',+id,await(await fetch(u)).blob())}catch(x){}}
 S=s;uid=Math.max(0,...S.expenses.map(e=>e.id))+1;save();render();alert('Respaldo importado ✓')}).catch(()=>alert('Archivo no válido'))}
function csv(){const h=['Fecha','Categoría','Descripción','Suplidor','Recibo','Total','Pagó Jose','Pagó Arnaldo','Pendiente','Comentario','Revisar','Documento'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const r=S.expenses.map(e=>[e.date,e.cat,e.desc,e.vendor,e.receipt,e.total,e.jose,e.arnaldo,pend(e),e.note,e.check,e.file].map(q).join(','));
 dl('gastos-villa-carolina.csv','﻿'+[h.map(q).join(','),...r].join('\r\n'),'text/csv')}
render();
</script>
